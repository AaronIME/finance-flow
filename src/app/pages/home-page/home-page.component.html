<div>
  <div class="flex flex-row justify-between items-center mb-5">
    <div class="flex flex-row gap-5 items-center">
      <h3 class="text-3xl font-bold">Resumen financiero:</h3>
      <div class="bg-white rounded-md shadow-sm px-2 py-2">
        <span class="text-blue-500 text-2xl font-bold">Cuenta 1</span>
      </div>
    </div>
    <div class="flex flex-row gap-5 justify-end mb-5">
      <Select
        class="text-sm text-gray-500 border border-gray-200 px-4 py-2 bg-white rounded-md shadow-sm"
      >
        <Option>Anual</Option>
        <Option>Mensual</Option>
      </Select>
      <Select
        class="text-sm text-gray-500 border border-gray-200 px-4 py-2 bg-white rounded-md shadow-sm"
      >
        <Option>2024</Option>
        <Option>2025</Option>
        <Option>2026</Option>
      </Select>
    </div>
  </div>
  <div class="flex flex-row gap-5">
    <div
      class="bg-white rounded-xl inline-flex px-4 py-4 flex-col w-55 shadow-sm"
    >
      <div class="flex flex-row justify-between items-center mb-5">
        <p class="text-xl font-bold text-blue-400">Saldo Actual</p>
        <div class="bg-blue-400 px-2 py-2 text-white rounded-xl">
          <svg lucideDollarSign></svg>
        </div>
      </div>
      <div class="flex flex-row justify-end items-center">
        <p class="text-2xl font-bold">$100</p>
      </div>
    </div>
    <div
      class="bg-white rounded-xl inline-flex px-4 py-4 flex-col w-55 shadow-sm"
    >
      <div class="flex flex-row justify-between items-center mb-5">
        <p class="text-xl font-bold text-green-400">Ingresos</p>
        <div class="bg-green-400 px-2 py-2 text-white rounded-xl">
          <svg lucideHandCoins></svg>
        </div>
      </div>
      <div class="flex flex-row justify-end items-center">
        <p class="text-2xl font-bold">$900</p>
      </div>
    </div>
    <div
      class="bg-white rounded-xl inline-flex px-4 py-4 flex-col w-55 shadow-sm"
    >
      <div class="flex flex-row justify-between items-center mb-5">
        <p class="text-xl font-bold text-red-400">Gastos</p>
        <div class="bg-red-400 px-2 py-2 text-white rounded-xl">
          <svg lucideReceipt></svg>
        </div>
      </div>
      <div class="flex flex-row justify-end items-center">
        <p class="text-2xl font-bold">$800</p>
      </div>
    </div>
    <div
      class="bg-white rounded-xl inline-flex px-4 py-4 flex-col w-55 shadow-sm"
    >
      <div class="flex flex-row justify-between items-center mb-5">
        <p class="text-xl font-bold text-gray-400">Ahorros</p>
        <div class="bg-gray-400 px-2 py-2 text-white rounded-xl">
          <svg lucidePiggyBank></svg>
        </div>
      </div>
      <div class="flex flex-row justify-end items-center">
        <p class="text-2xl font-bold">$100</p>
      </div>
    </div>
  </div>
  <apx-chart [series]="series" [chart]="chart" />

  <div class="mb-5">
    <h3 class="text-2xl font-bold mb-5">Presupuestos</h3>
    <div class="flex flex-col gap-5">
      <a
        routerLink="/dashboard/edit-budget/1"
        class="w-full h-full bg-white rounded-lg px-4 py-4 flex flex-col justify-between mb-3 shadow-lg cursor-pointer hover:bg-gray-200 transition-colors"
      >
        <div class="flex flex-row justify-between gap-3 mb-3">
          <p class="text-lg font-bold">Nombre</p>
          <p class="text-sm font-semibold">17/05/2026 - 15/06/2026</p>
        </div>
        <div class="w-full h-6 rounded-lg bg-gray-300 mb-3">
          <div class="w-[70%] h-6 rounded-lg bg-red-400 mb-3"></div>
        </div>
        <p>500 / 600</p>
      </a>
      <a
        routerLink="/dashboard/edit-budget/1"
        class="w-full bg-white rounded-lg px-4 py-4 flex flex-col mb-3 shadow-lg cursor-pointer hover:bg-gray-200 transition-colors"
      >
        <div class="flex flex-row justify-between gap-3 mb-3">
          <p class="text-lg font-bold">Nombre</p>
          <p class="text-sm font-semibold">17/05/2026 - 15/06/2026</p>
        </div>
        <div class="w-full h-6 rounded-lg bg-gray-300 mb-3">
          <div class="w-[70%] h-6 rounded-lg bg-red-400 mb-3"></div>
        </div>
        <p>500 / 600</p>
      </a>
    </div>
  </div>
  <div>
    <h3 class="text-2xl font-bold mb-5">Objetivos</h3>
    <div class="flex flex-row justify-around gap-5">

      <!-- <div class="flex justify-around items-center"> -->

        <apx-chart [plotOptions]="plotOptions" [series]="goalSeries1" [chart]="goalChart1" [labels]="labels1" />
      <!-- </div> -->
      <apx-chart [plotOptions]="plotOptions" [series]="goalSeries2" [chart]="goalChart2" [labels]="labels2" />
      
    </div>
  </div>
</div>
