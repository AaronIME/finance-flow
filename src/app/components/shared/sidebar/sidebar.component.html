<div class="h-full w-50 bg-gray-700 py-5 flex flex-col justify-between">
  <ul class="flex flex-col items-center justify-center overflow-y-auto">
    @for (item of menuOptions; track item.title) {
      <li
        class="ps-3 text-white h-12 w-full flex items-center justify-start hover:bg-gray-600 transition-colors"
      >
        <a
          class="h-full w-full flex items-center justify-start"
          [routerLink]="item.route"
        >
          <div class="flex flex-row items-center gap-2">
            <svg class="size-5" [lucideIcon]="item.icon"></svg> {{ item.title }}
          </div>
        </a>
      </li>
    }
  </ul>
  <div class="w-full px-3">
    <button class="cursor-pointer w-full flex flex-row items-center justify-between gap-2 bg-red-500 text-white px-4 py-2 rounded-lg">
      <span class="font-semibold">Logout</span> <svg class="size-5 " lucideLogOut></svg>
    </button>
  </div>
</div>
