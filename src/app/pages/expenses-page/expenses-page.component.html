<div class="flex flex-col">
  <h3 class="text-2xl font-bold mb-3">Historial de gastos</h3>
  <div class="mb-3">
    <div class="w-full flex justify-end mb-4">
      <a
        routerLink="/dashboard/create-expense"
        class="cursor-pointer flex flex-row gap-2 items-center bg-blue-950 text-white px-10 py-2 rounded-xl"
      >
        <span>Crear Gasto</span>
        <svg class="size-5 font-bold" lucidePlus></svg>
      </a>
    </div>
    <a
      routerLink="/dashboard/expense/1"
      class="bg-white rounded-lg px-4 py-4 flex flex-row justify-between mb-3 shadow-lg cursor-pointer hover:bg-gray-200 transition-colors"
    >
      <div class="flex flex-col justify-between gap-3">
        <p class="text-lg font-bold">Titulo</p>
        <p>Descripción</p>
      </div>
      <div class="flex flex-col justify-between gap-3">
        <p class="text-xl font-bold text-green-600">+$500</p>
        <button
          class="bg-red-500 text-white py-2 rounded-lg px-10"
          (click)="$event.preventDefault()"
        >
          <svg lucideTrash></svg>
        </button>
      </div>
    </a>

    <a
      routerLink="/dashboard/expense/2"
      class="bg-white rounded-lg px-4 py-4 flex flex-row justify-between mb-3 shadow-lg cursor-pointer hover:bg-gray-200 transition-colors"
    >
      <div class="flex flex-col justify-between gap-3">
        <p class="text-lg font-bold">Titulo</p>
        <p>Descripción</p>
      </div>
      <div class="flex flex-col justify-between gap-3">
        <p class="text-xl font-bold text-red-600">-$500</p>
        <button
          class="bg-red-500 text-white py-2 rounded-lg px-10"
          (click)="$event.preventDefault()"
        >
          <svg lucideTrash></svg>
        </button>
      </div>
    </a>
  </div>
  <pagination />
</div>
