<div class="flex flex-row justify-center">
  <div
    class="h-auto shadow-lg md:w-xl w-full bg-white p-10 rounded-xl flex flex-col justify-center"
  >
    <h3 class="text-center text-2xl font-semibold mb-10">
      Crear Nuevo Presupuesto
    </h3>
    <div class="mb-5 flex flex-col">
      <label for="Category" class="text-sm mb-2">Categoría</label>
      <Select
        class="border border-gray-200 px-2 py-2 rounded-md"
        placeholder="Selecciona una categoría"
        name="category"
        id="category"
      >
        <option value="1">Alimentación</option>
        <option value="2">Transporte</option>
        <option value="3">Vivienda</option>
        <option value="4">Educación</option>
        <option value="5">Salud</option>
        <option value="6">Diversión</option>
        <option value="7">Otros</option>
      </Select>
    </div>
    <div class="mb-3 flex flex-col">
      <label for="amount" class="text-sm mb-2">Monto</label>
      <input
        class="border border-gray-200 px-2 py-2 rounded-md"
        type="number"
        name="amount"
        id="amount"
        placeholder="500"
      />
    </div>
    <div class="flex flex-row gap-5">
      <div class="w-full mb-5 flex flex-col">
        <label for="date" class="text-sm mb-2">Fecha de inicio</label>
        <input
          id="date"
          name="date"
          type="date"
          class="border border-gray-200 px-2 py-2 rounded-md"
          placeholder="2026-01-01"
        />
      </div>
      <div class="w-full mb-5 flex flex-col">
        <label for="date" class="text-sm mb-2">Fecha de fin</label>
        <input
          id="date"
          name="date"
          type="date"
          class="border border-gray-200 px-2 py-2 rounded-md"
          placeholder="2026-01-01"
        />
      </div>
    </div>

   
    <div class="flex flex-row justify-end">
      <button
        class="mb-3 px-10 py-2 rounded-xl cursor-pointer bg-blue-950 text-white block"
      >
        Crear presupuesto
      </button>
    </div>
  </div>
</div>
